<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scale="1.0">
    <link rel="stylesheet" href="src/estilo.css">
    <link rel="icon" type="image/x-icon" href="src/assets/images/invader.ico">
    <title>SpaceOhNo!</title>
</head>
<body>
    <section class="score-ui"> 
        <div>
            <span class="lives">vidas: <span>3</span></span>
            <span class="level">nivel: <span>1</span></span>
            <span class="timer">tempo: <span>45s</span></span>
            <span class="score">pontuação: <span>0</span></span>
            <span class="high">máximo: <span>0</span></span>
        </div>

    <section class="start-screen screen">
        <div>
            <h1>SpaceOhNo!</h1>
            <button class="button-play">Jogar</button>
        </div>
        <span onclick="window.location.href='https://l0nelyb0y.github.io/ProjetoFinalWebSite/'">Projeto Final</span>
    </section>
    <section class="game-over screen">
        <div>
            <h1>Game Over</h1>
            <button class="button-restart">Reiniciar</button>
        </div>
    </section>
    <canvas></canvas>
    <script type="module" src="src/index.js"></script>

</html>
