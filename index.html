<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scale="1.0">
    <link rel="stylesheet" href="src/estilo.css">
    <link rel="icon" type="image/x-icon" href="src/assets/images/invader.ico">
    <title>SpaceOhNo!</title>
</head>
<body>
    <section class="score-ui"> 
        <div>
            <span class="score">pontuação: <span>0</span></span>
            <span class="level">nivel: <span>1</span></span>
            <span class="high">maximo: <span>0</span></span>
            <span class="timer">tempo: <span>30s</span></span>
        </div>
    </section>

    <section class="start-screen screen">
        <div>
            <h1>SpaceOhNo!</h1>
            <button class="button-play">Jogar</button>
        </div>
        <span>Projeto Final</span>
    </section>

    <section class="game-over screen">
        <div>
            <h1>Game Over</h1>
            <button class="button-restart">Reiniciar</button>
        </div>
    </section>

    <canvas></canvas>
    <script type="module" src="src/index.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const numStars = 100;
            const container = document.body;

            for (let i = 0; i < numStars; i++) {
                let star = document.createElement("div");
                star.classList.add("star");
                star.style.top = Math.random() * window.innerHeight + "px";
                star.style.left = Math.random() * window.innerWidth + "px";
                star.style.animationDuration = (Math.random() * 2 + 1) + "s";
                container.appendChild(star);
            }
        })
    </script>
</body>
</html>
